<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>方位詞遊戲</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff8ee;--card:#fff;--tx:#3a2e22;--mut:#8a7a68;--pri:#e8743b;--ok:#2e9e5b;--bad:#d64545;--bd:#f0dcc4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a15;--card:#2a231c;--tx:#f3e9dc;--mut:#b5a794;--pri:#f08a55;--ok:#4cc27f;--bad:#f06a6a;--bd:#43382c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:480px}
h1{text-align:center;margin:8px 0 4px;font-size:1.6rem}
.sub{text-align:center;color:var(--mut);font-size:.85rem;margin-bottom:14px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px}
input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;margin:6px 0 10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:#fff;font-weight:600;width:100%;margin-top:8px}
button.alt{background:transparent;color:var(--tx);border:2px solid var(--bd)}
.hide{display:none!important}
.stats{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem}
.bar{height:8px;background:var(--bd);border-radius:6px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.q{margin:12px 0 6px}
.swatch{height:150px;border-radius:16px;border:3px solid var(--bd)}
.word{font-size:4.2rem;font-weight:700;text-align:center;line-height:1.4;padding:10px 0}
.spk{width:auto;display:block;margin:0 auto 6px;padding:8px 20px}
.msg{text-align:center;min-height:1.6em;margin:6px 0;font-weight:600}
.remind{background:#fff3c4;color:#5a4300;border:2px solid #f0c040;border-radius:12px;padding:10px;margin:8px 0;text-align:center;font-weight:600}
.chip{display:inline-block;width:1.1em;height:1.1em;border-radius:5px;vertical-align:-.15em;border:2px solid rgba(0,0,0,.25);margin:0 .2em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{background:var(--bg);color:var(--tx);border:3px solid var(--bd);font-size:1.7rem;margin:0;padding:16px 4px}
.opts button.sw{height:96px;color:#fff;font-size:2rem;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.opts button.ok{outline:6px solid var(--ok);outline-offset:-2px}
.opts button.bad{outline:6px solid var(--bad);outline-offset:-2px;opacity:.75}
.opts button:not(.sw).ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button:not(.sw).bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.save{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
.save span{flex:1}
.save button{width:auto;margin:0;padding:6px 12px}
.big{font-size:2.6rem;text-align:center;margin:6px 0}
</style>
</head>
<body>
<main>
<h1>📍 方位詞遊戲</h1>
<div class="sub" id="sub">聽發音、看文字，選出正確的英文（共 9 個）<br>答錯的會重複出現，一直到答對為止</div>

<section id="home" class="card">
  <label>👤 學生姓名：<input id="name" placeholder="請輸入姓名" maxlength="20"></label>
  <button id="btnNew">🚀 開始新測驗</button>
  <button id="btnResume" class="alt">▶️ 恢復上次進度</button>
  <button id="btnList" class="alt">📋 已儲存的進度</button>
  <button id="btnWrong" class="alt">❗ 曾經選錯的方位詞</button>
  <div id="saves" class="hide"></div>
  <div id="wrongs" class="hide"></div>
</section>

<section id="quiz" class="card hide">
  <div class="stats"><span>得分：<b id="score">0</b></span><span>剩餘：<b id="left">0</b> 題</span></div>
  <div class="bar"><i id="fill"></i></div>
  <div id="q" class="q"></div>
  <button id="btnSpk" class="alt spk">🔊 再聽一次</button>
  <div id="msg" class="msg"></div>
  <div id="remind" class="remind hide"></div>
  <div id="opts" class="opts"></div>
  <button id="btnNext" class="hide">下一題 →</button>
  <button id="btnStop" class="alt">⏹️ 停止測驗</button>
</section>

<section id="done" class="card hide">
  <div class="big">🎉</div>
  <div id="result" class="msg"></div>
  <button id="btnAgain" class="alt">🏠 回到首頁</button>
</section>
</main>

<script>
// 要新增詞語，只要在這裡加一行：中文(n)、英文(en)
// say：朗讀用的文字（和顯示的字不同時才需要）；f：錄音檔名（audio/檔名.mp3）
const ITEMS=[
  {n:"上面",en:"above",f:"shangmian",say:"上，面"},
  {n:"下面",en:"below",f:"xiamian"},
  {n:"左邊",en:"left",f:"zuobian"},
  {n:"右邊",en:"right",f:"youbian"},
  {n:"裡面",en:"inside",f:"limian"},
  {n:"外面",en:"outside",f:"waimian"},
  {n:"前面",en:"in front",f:"qianmian"},
  {n:"後面",en:"behind",f:"houmian"},
  {n:"中間",en:"middle",f:"zhongjian"}
];
const BY=Object.fromEntries(ITEMS.map(c=>[c.n,c]));
const KEY="pos_saves";
const $=id=>document.getElementById(id);
// 成績收集網址（Google Apps Script 網頁應用程式）。留空表示不上傳成績。
const SHEET_URL="https://script.google.com/macros/s/AKfycbyFl4FOl9Sa5Pcahal5DAim8DplCNKMK1YWO_9E8t91TSpxlzcPis_mCS5tw5to9nBRKA/exec";
const GAME="方位詞遊戲";
let S=null,NAME="",answered=false,Q=null,syncT;
function sync(){
  if(!SHEET_URL||!S)return;
  clearTimeout(syncT);
  syncT=setTimeout(()=>{try{
    const w=(S.wrong||[]).map(n=>n+"×"+((S.cnt||{})[n]||1)).join("、");
    fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({game:GAME,id:S.id,name:S.name,total:S.total,score:S.score,remaining:new Set(S.queue).size,wrong:w})}).catch(()=>{});
  }catch(e){}},400);
}

function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const saves=()=>store(KEY)||[];
const mine=()=>saves().filter(s=>s.name===NAME).sort((a,b)=>b.time-a.time);
const fmt=t=>new Date(t).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});

function show(id){
  ["home","quiz","done"].forEach(x=>$(x).classList.toggle("hide",x!==id));
  $("sub").classList.toggle("hide",id!=="home");
  window.scrollTo(0,0);
}
function persist(){
  if(!S)return;S.time=Date.now();
  const l=saves().filter(s=>s.id!==S.id);l.unshift(S);store(KEY,l.slice(0,200));sync();
}
function getName(){
  const n=$("name").value.trim();
  if(!n){alert("請先輸入學生姓名");$("name").focus();return null}
  NAME=n;return n;
}
function start(state){
  S=state;
  S.queue=shuffle(S.queue.filter(n=>BY[n]));   // 每次進入遊戲，題序重新排列
  show("quiz");render();
}
function newQuiz(){
  if(!getName())return;
  start({id:"q"+Date.now(),name:NAME,queue:ITEMS.map(c=>c.n),score:0,total:ITEMS.length,wrong:[],tried:[],cnt:{}});
  persist();
}
const NOFILE=new Set();let cur=null;
function tts(t){
  try{
    speechSynthesis.cancel();
    for(let i=0;i<2;i++){          // 朗讀 2 次
      const u=new SpeechSynthesisUtterance(t);u.lang="zh-TW";u.volume=1;u.rate=.8;speechSynthesis.speak(u);
    }
  }catch(e){}
}
// 有錄音檔就播錄音（連播 2 次），沒有才用電腦語音
function speak(c){
  try{speechSynthesis.cancel()}catch(e){}
  try{if(cur){cur.onended=null;cur.pause();cur=null}}catch(e){}
  if(NOFILE.has(c.n)){tts(c.say||c.n);return}
  try{
    const a=new Audio("audio/"+c.f+".mp3");a.volume=1;cur=a;let times=0;
    a.addEventListener("error",()=>{NOFILE.add(c.n);tts(c.say||c.n)},{once:true});
    a.onended=()=>{if(++times<2){a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{})}};
    const p=a.play();if(p&&p.catch)p.catch(()=>{});
  }catch(e){NOFILE.add(c.n);tts(c.say||c.n)}
}
function render(){
  answered=false;S.cnt=S.cnt||{};$("remind").classList.add("hide");
  S.queue=S.queue.filter(n=>BY[n]);
  if(!S.queue.length)return finish();
  const n=S.queue[0],c=BY[n];
  $("score").textContent=S.score;$("left").textContent=S.queue.length;
  $("fill").style.width=((S.total-new Set(S.queue).size)/S.total*100)+"%";
  $("btnNext").classList.add("hide");$("msg").style.color="";
  const others=shuffle(ITEMS.filter(x=>x.n!==n)).slice(0,3);   // 英文選項各不相同，只有一個正確答案
  Q={n};
  const q=$("q");q.textContent="";
  const w=document.createElement("div");w.className="word";w.textContent=n;q.appendChild(w);
  $("msg").textContent="👂 聽聽看、看文字，英文是什麼？";
  $("opts").innerHTML="";
  shuffle([c,...others]).forEach(o=>{
    const b=document.createElement("button");b.textContent=o.en;b.dataset.k=o.n;
    b.onclick=()=>choose(b);$("opts").appendChild(b);
  });
  speak(c);
}
function choose(btn){
  if(answered)return;answered=true;
  const n=Q.n,c=BY[n],good=btn.dataset.k===n;
  [...$("opts").children].forEach(b=>{if(b.dataset.k===n)b.classList.add("ok")});
  if(good){
    $("msg").textContent="✅ 答對了！"+n+" = "+c.en;$("msg").style.color="var(--ok)";
    if(!S.tried.includes(n))S.score++;
    S.queue.shift();
  }else{
    btn.classList.add("bad");
    $("msg").textContent="❌ 「"+n+"」的英文是 "+c.en+"，稍後會再出現";$("msg").style.color="var(--bad)";
    if(!S.tried.includes(n)){S.tried.push(n);S.wrong.push(n)}
    S.cnt[n]=(S.cnt[n]||0)+1;
    if(S.cnt[n]>=3){const r=$("remind");r.textContent="🔔 「"+n+"」已經答錯 "+S.cnt[n]+" 次了，正確的英文是："+c.en;r.classList.remove("hide")}
    S.queue.shift();
    S.queue.splice(Math.min(S.queue.length,2+(Math.random()*3|0)),0,n);
  }
  persist();
  $("left").textContent=S.queue.length;$("score").textContent=S.score;
  $("btnNext").textContent=S.queue.length?"下一題 →":"看成績 →";
  $("btnNext").classList.remove("hide");
}
function finish(){
  show("done");
  const r=$("result");r.textContent="";
  r.append(S.name+"，完成！",document.createElement("br"),"一次答對 "+S.score+" / "+S.total,document.createElement("br"));
  const sm=document.createElement("small");sm.style.color="var(--mut)";
  sm.textContent="答錯過："+(S.wrong.join("、")||"無");r.appendChild(sm);
}
function listSaves(){
  if(!getName())return;
  const box=$("saves"),l=mine();$("wrongs").classList.add("hide");box.classList.remove("hide");box.textContent="";
  if(!l.length){const d=document.createElement("div");d.className="msg";d.style.color="var(--mut)";d.textContent=NAME+" 還沒有答題紀錄";box.appendChild(d);return}
  l.forEach(s=>{
    const d=document.createElement("div");d.className="save";
    const sp=document.createElement("span"),fin=!s.queue.length;
    sp.textContent=fmt(s.time)+"・"+(fin?"✅ 完成":"⏳ 剩 "+new Set(s.queue).size+" 題")+"・一次答對 "+s.score+"/"+s.total;
    const a=document.createElement("button");a.textContent=fin?"成績":"繼續";
    a.onclick=()=>{if(fin){S=s;finish()}else start(s)};
    const x=document.createElement("button");x.textContent="🗑";x.className="alt";
    x.onclick=()=>{if(confirm("確定刪除這筆紀錄？")){store(KEY,saves().filter(v=>v.id!==s.id));listSaves()}};
    d.append(sp,a,x);box.appendChild(d);
  });
}
function showWrong(){
  if(!getName())return;
  const box=$("wrongs"),m={};
  mine().forEach(s=>(s.wrong||[]).forEach(n=>{m[n]=(m[n]||0)+((s.cnt&&s.cnt[n])||1)}));
  $("saves").classList.add("hide");box.classList.remove("hide");box.textContent="";
  const e=Object.entries(m).filter(([n])=>BY[n]).sort((a,b)=>b[1]-a[1]);
  const h=document.createElement("div");h.className="msg";
  if(!e.length){h.style.color="var(--mut)";h.textContent=NAME+" 目前沒有答錯的方位詞 🎉";box.appendChild(h);return}
  h.textContent="共 "+e.length+" 個，累計答錯 "+e.reduce((a,x)=>a+x[1],0)+" 次";box.appendChild(h);
  e.forEach(([n,k])=>{
    const d=document.createElement("div");d.className="save";
    const sp=document.createElement("span"),b=document.createElement("b");b.style.fontSize="1.4rem";b.textContent=n;
    sp.append(b,"　"+BY[n].en);
    const t=document.createElement("b");t.style.color="var(--bad)";t.textContent="錯 "+k+" 次";
    d.append(sp,t);box.appendChild(d);
  });
}
$("btnNew").onclick=newQuiz;
$("btnResume").onclick=()=>{if(!getName())return;const s=mine().find(v=>v.queue.length);if(!s){alert("沒有可恢復的進度");return}start(s)};
$("btnList").onclick=listSaves;
$("btnWrong").onclick=showWrong;
$("btnNext").onclick=render;
$("btnSpk").onclick=()=>Q&&speak(BY[Q.n]);
$("btnStop").onclick=()=>{persist();try{speechSynthesis.cancel()}catch(e){}$("saves").classList.add("hide");$("wrongs").classList.add("hide");show("home")};
$("btnAgain").onclick=()=>{$("saves").classList.add("hide");$("wrongs").classList.add("hide");show("home")};
if(!("speechSynthesis" in window)){$("btnSpk").classList.add("hide");$("sub").insertAdjacentHTML("beforeend","<br>⚠️ 這個瀏覽器不支援語音，請依文字作答")}
</script>
</body>
</html>
