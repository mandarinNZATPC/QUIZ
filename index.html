<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>識字遊戲</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff8ee;--card:#fff;--tx:#3a2e22;--mut:#8a7a68;--pri:#e8743b;--ok:#2e9e5b;--bad:#d64545;--bd:#f0dcc4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a15;--card:#2a231c;--tx:#f3e9dc;--mut:#b5a794;--pri:#f08a55;--ok:#4cc27f;--bad:#f06a6a;--bd:#43382c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:480px}
h1{text-align:center;margin:8px 0 4px;font-size:1.6rem}
.sub{text-align:center;color:var(--mut);font-size:.85rem;margin-bottom:14px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px}
input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;margin:6px 0 10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:#fff;font-weight:600;width:100%;margin-top:8px}
button.alt{background:transparent;color:var(--tx);border:2px solid var(--bd)}
.hide{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{margin:0;padding:12px 4px}
.stats{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem}
.bar{height:8px;background:var(--bd);border-radius:6px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.char{font-size:6.5rem;text-align:center;line-height:1.2;margin:10px 0 8px;font-family:"Kaiti TC","BiauKai","DFKai-SB","Noto Serif TC",serif}
.msg{text-align:center;min-height:1.6em;margin:6px 0;font-weight:600}
.remind{background:#fff3c4;color:#5a4300;border:2px solid #f0c040;border-radius:12px;padding:10px;margin:8px 0;text-align:center;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{background:var(--bg);color:var(--tx);border:2px solid var(--bd);font-size:1.5rem;margin:0;padding:16px 4px;font-family:"BopomofoTC","PingFang TC","Noto Sans TC",sans-serif}
.opts button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.save{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
.save span{flex:1}
.save button{width:auto;margin:0;padding:6px 12px}
.lab{font-weight:600;margin:14px 0 8px}
.big{font-size:2.6rem;text-align:center;margin:6px 0}
</style>
</head>
<body>
<main>
<h1 id="ttl">識字遊戲</h1>
<div class="sub">答錯的字會重複出現，一直到答對為止</div>

<section id="home" class="card">
  <label>👤 學生姓名：<input id="name" placeholder="請輸入姓名" maxlength="20"></label>
  <div class="lab">📚 請選擇冊別：</div>
  <div id="books" class="grid"></div>
</section>

<section id="book" class="card hide">
  <div id="bkinfo" class="msg"></div>
  <button id="btnNew">🚀 開始新測驗</button>
  <button id="btnResume" class="alt">▶️ 恢復上次進度</button>
  <button id="btnList" class="alt">📋 已儲存的進度</button>
  <div id="saves" class="hide"></div>
  <button id="btnBack" class="alt">← 返回選單</button>
</section>

<section id="quiz" class="card hide">
  <div class="stats"><span>得分：<b id="score">0</b></span><span>剩餘：<b id="left">0</b> 題</span></div>
  <div class="bar"><i id="fill"></i></div>
  <div id="ch" class="char">一</div>
  <div id="msg" class="msg"></div>
  <div id="remind" class="remind hide"></div>
  <div id="opts" class="opts"></div>
  <button id="btnNext" class="hide">下一題 →</button>
  <button id="btnStop" class="alt">⏹️ 停止測驗</button>
</section>

<section id="done" class="card hide">
  <div class="big">🎉</div>
  <div id="result" class="msg"></div>
  <button id="btnMail">📧 寄送成績給老師</button>
  <button id="btnAgain" class="alt">🔄 回到本冊選單</button>
</section>
</main>

function show(id){
  ["home","book","quiz","done"].forEach(x=>$(x).classList.toggle("hide",x!==id));
  $("ttl").textContent=(B&&id!=="home")?B.n+"識字遊戲":"識字遊戲";
  window.scrollTo(0,0);
}
function persist(){
  if(!S)return;S.time=Date.now();
  const l=saves().filter(s=>s.id!==S.id);l.unshift(S);store("zq_saves",l.slice(0,400));
}
function pickBook(b){
  const name=$("name").value.trim();
  if(!name){alert("請先輸入學生姓名");$("name").focus();return}
  NAME=name;store("zq_name",name);B=b;
  ZM=Object.fromEntries(b.d.map(d=>[d.c,d.z]));
  $("bkinfo").textContent="學生："+NAME+"・共 "+b.d.length+" 字";
  $("saves").classList.add("hide");
  show("book");
}
function start(state){S=state;show("quiz");render()}
function newQuiz(){
  start({id:"q"+Date.now(),book:B.n,name:NAME,queue:shuffle(B.d.map(d=>d.c)),score:0,total:B.d.length,wrong:[],tried:[],cnt:{}});
  persist();
}
function render(){
  answered=false;S.cnt=S.cnt||{};$("remind").classList.add("hide");
  if(!S.queue.length)return finish();
  const c=S.queue[0],z=ZM[c];
  $("ch").textContent=c;
  $("score").textContent=S.score;
  $("left").textContent=S.queue.length;
  $("fill").style.width=((S.total-new Set(S.queue).size)/S.total*100)+"%";
  $("msg").textContent="✨ 選一個注音吧";$("msg").style.color="";
  $("btnNext").classList.add("hide");
  const others=POOL.filter(x=>x!==z).map(x=>({x,w:(base(x)===base(z)?2:0)+(base(x)[0]===base(z)[0]?1:0)+Math.random()*1.5}))
    .sort((a,b)=>b.w-a.w).slice(0,3).map(o=>o.x);
  $("opts").innerHTML="";
  shuffle([z,...others]).forEach(o=>{
    const b=document.createElement("button");b.textContent=o;b.onclick=()=>pick(b,o);$("opts").appendChild(b);
  });
}
function pick(btn,o){
  if(answered)return;answered=true;
  const c=S.queue[0],z=ZM[c];
  [...$("opts").children].forEach(b=>{if(b.textContent===z)b.classList.add("ok")});
  if(o===z){
    $("msg").textContent="✅ 答對了！";$("msg").style.color="var(--ok)";
    if(!S.tried.includes(c))S.score++;
    S.queue.shift();
  }else{
    btn.classList.add("bad");
    $("msg").textContent="❌ 正確是 "+z+"，稍後會再出現";$("msg").style.color="var(--bad)";
    if(!S.tried.includes(c)){S.tried.push(c);S.wrong.push(c)}
    S.cnt[c]=(S.cnt[c]||0)+1;
    if(S.cnt[c]>=3){const r=$("remind");r.textContent="🔔 「"+c+"」已經答錯 "+S.cnt[c]+" 次了，正確讀音是："+z;r.classList.remove("hide")}
    S.queue.shift();
    S.queue.splice(Math.min(S.queue.length,4+(Math.random()*4|0)),0,c);
  }
  persist();
  $("left").textContent=S.queue.length;$("score").textContent=S.score;
  $("btnNext").textContent=S.queue.length?"下一題 →":"看成績 →";
  $("btnNext").classList.remove("hide");
}
function summary(){
  return `學生：${S.name}\n測驗：${S.book}識字遊戲（${S.total} 字）\n一次答對：${S.score} / ${S.total}\n答錯過的字：${S.wrong.join("、")||"無"}\n完成度：${S.total-new Set(S.queue).size} / ${S.total}`;
}
function finish(){
  show("done");
  const r=$("result");r.textContent="";
  r.append(S.name+"，完成！",document.createElement("br"),"一次答對 "+S.score+" / "+S.total,document.createElement("br"));
  const sm=document.createElement("small");sm.style.color="var(--mut)";sm.textContent="答錯過："+(S.wrong.join("、")||"無");r.appendChild(sm);
}
function mail(){
  const to=atob("bHVyZTU0ODhAZ21haWwuY29t");
  location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(S.name+" 的"+S.book+"識字遊戲成績")}&body=${encodeURIComponent(summary())}`;
}
function listSaves(){
  const box=$("saves"),l=mine();box.classList.remove("hide");box.textContent="";
  if(!l.length){const d=document.createElement("div");d.className="msg";d.style.color="var(--mut)";d.textContent=NAME+" 在"+B.n+"還沒有答題紀錄";box.appendChild(d);return}
  l.forEach(s=>{
    const d=document.createElement("div");d.className="save";
    const sp=document.createElement("span");
    const fin=!s.queue.length;
    sp.textContent=fmt(s.time)+"・"+(fin?"✅ 完成":"⏳ 剩 "+new Set(s.queue).size+" 題")+"・一次答對 "+s.score+"/"+s.total;
    const a=document.createElement("button");a.textContent=fin?"成績":"繼續";
    a.onclick=()=>{if(fin){S=s;finish()}else start(s)};
    const x=document.createElement("button");x.textContent="🗑";x.className="alt";
    x.onclick=()=>{if(confirm("確定刪除這筆紀錄？")){store("zq_saves",saves().filter(v=>v.id!==s.id));listSaves()}};
    d.append(sp,a,x);box.appendChild(d);
  });
}
BOOKS.forEach(b=>{const k=document.createElement("button");k.className="alt";k.textContent=b.n;k.onclick=()=>pickBook(b);$("books").appendChild(k)});
$("btnNew").onclick=newQuiz;
$("btnResume").onclick=()=>{const s=mine().find(v=>v.queue.length);if(!s){alert("沒有可恢復的進度");return}start(s)};
$("btnList").onclick=listSaves;
$("btnNext").onclick=render;
$("btnStop").onclick=()=>{persist();show("book")};
$("btnBack").onclick=()=>{B=null;show("home")};
$("btnMail").onclick=mail;
$("btnAgain").onclick=()=>show("book");
(function(){try{
  if(!localStorage.getItem("zq_mig")){
    let l=saves();
    BOOKS.forEach(b=>{const o=store("zq_saves_"+b.n);if(o)o.forEach(s=>{s.book=b.n;l.push(s)})});
    store("zq_saves",l);localStorage.setItem("zq_mig","1");
  }
}catch(e){}})();
$("name").value=store("zq_name")||"";
</script>
</body>
</html>
